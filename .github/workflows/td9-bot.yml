name: BTA TD9 Bot

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos (hora UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "Que hacer"
        type: choice
        options: [revisar, prueba, estado, reporte_diario, preapertura, grupos, backtest]
        default: revisar

permissions:
  contents: write

concurrency:
  group: td9-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_SENALES: ${{ secrets.TELEGRAM_CHAT_ID_SENALES }}
          TELEGRAM_CHAT_ID_OPCIONES: ${{ secrets.TELEGRAM_CHAT_ID_OPCIONES }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            prueba) python bot.py --test ;;
            estado) python bot.py --status ;;
            reporte_diario) python bot.py --report daily ;;
            preapertura) python bot.py --report preopen ;;
            grupos) python bot.py --chats ;;
            backtest) python backtest.py ;;
            *)      python bot.py ;;
          esac

      - name: Guardar senales enviadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Actualiza senales enviadas [skip ci]" && git push)
